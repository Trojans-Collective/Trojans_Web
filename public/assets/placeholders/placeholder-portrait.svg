<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1114" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  
  <!-- Outer Technical Border -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Corner Crosshairs -->
  <path d="M16 24 L32 24 M24 16 L24 32" stroke="#D4FF00" stroke-width="2" />
  <path d="M768 24 L784 24 M776 16 L776 32" stroke="#D4FF00" stroke-width="2" />
  <path d="M16 976 L32 976 M24 968 L24 984" stroke="#D4FF00" stroke-width="2" />
  <path d="M768 976 L784 976 M776 968 L776 984" stroke="#D4FF00" stroke-width="2" />

  <!-- Center Watermark & Spec -->
  <g transform="translate(400, 480)" text-anchor="middle">
    <circle cx="0" cy="-60" r="44" fill="none" stroke="rgba(212, 255, 0, 0.2)" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Portrait Silhouette Outline -->
    <circle cx="0" cy="-76" r="16" fill="none" stroke="#D4FF00" stroke-width="1.5" />
    <path d="M-24,-42 C-24,-52 24,-52 24,-42" fill="none" stroke="#E2E4E8" stroke-width="1.5" />
    
    <text y="24" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#E2E4E8">
      BUILDER PORTRAIT
    </text>
    <text y="52" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#D4FF00">
      ASSET PLACEHOLDER — 4:5 PORTRAIT
    </text>
    <text y="78" font-family="'Inter', sans-serif" font-size="11" letter-spacing="1" fill="#6B7280">
      AUTHENTIC MEMBER PHOTOGRAPHY REQUIRED
    </text>
  </g>

  <!-- Technical Readouts -->
  <text x="44" y="955" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4B5563" letter-spacing="1.5">
    SPEC: 800x1000 / 1200x1500 • RATIO 4:5 • FORMAT: WEBP/JPG
  </text>
  <text x="756" y="955" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4B5563" letter-spacing="1.5">
    PERSONNEL ARCHIVE
  </text>
</svg>
